name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate latest-auto pipeline (optional, requires secrets)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LATEST_WID_YT_QUERY: ${{ vars.LATEST_WID_YT_QUERY }}
          LATEST_WID_YT_CHANNEL_IDS: ${{ vars.LATEST_WID_YT_CHANNEL_IDS }}
          LATEST_WID_MIN_DURATION_SECONDS: ${{ vars.LATEST_WID_MIN_DURATION_SECONDS }}
          LATEST_WID_BLOCKED_TERMS: ${{ vars.LATEST_WID_BLOCKED_TERMS }}
          LATEST_WID_LLM_PROVIDER: ${{ vars.LATEST_WID_LLM_PROVIDER }}
          LATEST_WID_LLM_MODEL: ${{ vars.LATEST_WID_LLM_MODEL }}
          LATEST_WID_LLM_MIN_SCORE: ${{ vars.LATEST_WID_LLM_MIN_SCORE }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Skipping latest-auto pipeline validation: YOUTUBE_API_KEY is not set."
            exit 0
          fi
          bun scripts/build-latest-news-feed.ts --out /tmp/latest-feed.generated.json --seed static/cdn/repo/latest-feed.sample.json
          EXTRA_ARGS=""
          if [ -n "$LATEST_WID_LLM_PROVIDER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --llm-provider $LATEST_WID_LLM_PROVIDER"
          fi
          if [ -n "$LATEST_WID_LLM_MODEL" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --llm-model $LATEST_WID_LLM_MODEL"
          fi
          if [ -n "$LATEST_WID_LLM_MIN_SCORE" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --llm-min-score $LATEST_WID_LLM_MIN_SCORE"
          fi
          bun scripts/generate-latest-wid.ts \
            --feed /tmp/latest-feed.generated.json \
            --out /tmp/latest-auto.wid \
            --verify-news \
            --strict-news \
            --max-age-hours 72 \
            --min-keyword-hits 1 \
            $EXTRA_ARGS

      - name: Validate manifest
        run: bun run manifest:check

      - name: Validate manifest compatibility
        run: bun run manifest:compat

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  desktop:
    name: Desktop Backend (Rust)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend for Tauri
        run: bun run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg dependencies (macOS)
        run: |
          brew update
          brew install pkg-config ffmpeg
          FFMPEG_PREFIX="$(brew --prefix ffmpeg)"
          echo "PKG_CONFIG_PATH=${FFMPEG_PREFIX}/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${FFMPEG_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPATH=${FFMPEG_PREFIX}/include" >> "$GITHUB_ENV"
          echo "PATH=${FFMPEG_PREFIX}/bin:$PATH" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked
