name: Release MAS (Template)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build-mas:
    name: Build macOS App Store Candidate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          brew install pkg-config ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix ffmpeg)/lib" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix)/include:$(brew --prefix ffmpeg)/include" >> "$GITHUB_ENV"

      - name: Import Apple MAS certificate
        if: env.APPLE_MAS_CERTIFICATE != ''
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_MAS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm cert.p12

      - name: Resolve signing identity
        shell: bash
        env:
          APPLE_MAS_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          IDS_RAW="$(security find-identity -v -p codesigning build.keychain || true)"
          echo "$IDS_RAW"

          if [ -z "${IDS_RAW}" ]; then
            echo "No signing identities found in build.keychain" >&2
            exit 1
          fi

          CANDIDATE=""
          if [ -n "${APPLE_MAS_SIGNING_IDENTITY:-}" ] && echo "$IDS_RAW" | grep -Fq "$APPLE_MAS_SIGNING_IDENTITY"; then
            CANDIDATE="$APPLE_MAS_SIGNING_IDENTITY"
          else
            CANDIDATE="$(echo "$IDS_RAW" | awk -F\" '/\".*\"/ {print $2; exit}')"
          fi

          if [ -z "${CANDIDATE}" ]; then
            echo "Failed to resolve a signing identity." >&2
            exit 1
          fi

          echo "Resolved signing identity: ${CANDIDATE}"
          echo "APPLE_MAS_SIGNING_IDENTITY=${CANDIDATE}" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=${CANDIDATE}" >> "$GITHUB_ENV"

      - name: Build MAS app bundle
        env:
          # Use resolved MAS signing identity.
          APPLE_MAS_SIGNING_IDENTITY: ${{ env.APPLE_MAS_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          # Explicitly disable notarization env for MAS build path.
          APPLE_ID: ""
          APPLE_PASSWORD: ""
          APPLE_TEAM_ID: ""
          APPLE_API_KEY: ""
          APPLE_API_ISSUER: ""
          APPLE_API_KEY_PATH: ""
        run: bun run build:tauri:mas

      - name: Upload MAS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mas-app-bundle
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/**/*.app
          if-no-files-found: warn

      - name: MAS TODO marker
        run: |
          echo "This is a baseline template."
          echo "Next: add provisioning profile handling + App Store Connect upload (Transporter/altool/notarytool as appropriate)."
