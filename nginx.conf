server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/yaml
        application/waldiez
        image/svg+xml;
    gzip_min_length 1024;

    # latest-auto.wid — always fetch fresh from the origin (never cache)
    location ~* /latest-auto\.wid$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Hashed static assets (JS/CSS/fonts with content-hash in filename)
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
